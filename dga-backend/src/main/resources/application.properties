# Default Profile Configuration
# Activate specific profile: dev, test, or prod
spring.profiles.active=test

# Common Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
dga.metadata.collect.cron=0 0 2 * * ?
dga.metadata.partition.latest-limit=200
dga.jwt.secret=${DGA_JWT_SECRET:dga-development-secret-change-me}
dga.jwt.expiration-seconds=${DGA_JWT_EXPIRATION_SECONDS:28800}
dga.auth.allow-admin-bootstrap=${DGA_ALLOW_ADMIN_BOOTSTRAP:false}
