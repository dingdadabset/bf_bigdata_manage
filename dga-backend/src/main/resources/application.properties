# Default Profile Configuration
# Activate specific profile: dev, test, or prod
spring.profiles.active=test

# Common Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
dga.metadata.collect.cron=0 0 2 * * ?
dga.metadata.partition.latest-limit=200
dga.jwt.secret=${DGA_JWT_SECRET:dga-development-secret-change-me}
dga.jwt.expiration-seconds=${DGA_JWT_EXPIRATION_SECONDS:28800}
dga.auth.allow-admin-bootstrap=${DGA_ALLOW_ADMIN_BOOTSTRAP:false}
dga.hive.legacy-driver.jar-path=${DGA_HIVE_LEGACY_DRIVER_JAR_PATH:}
dga.hive.legacy-driver.class-name=${DGA_HIVE_LEGACY_DRIVER_CLASS_NAME:org.apache.hive.jdbc.HiveDriver}

# Optional named Hive JDBC drivers for old clusters.
# Example:
# dga.hive.jdbc.drivers[0].key=legacy-cdh5
# dga.hive.jdbc.drivers[0].name=CDH5 / Hive 1.x
# dga.hive.jdbc.drivers[0].driver-class-name=org.apache.hive.jdbc.HiveDriver
# dga.hive.jdbc.drivers[0].jar-path=/opt/dga/drivers/hive-jdbc-1.1.0-cdh5.16.2-standalone.jar
# dga.hive.jdbc.drivers[0].description=适用于老版本 CDH5 / HiveServer2
# dga.hive.jdbc.drivers[0].enabled=true
# dga.hive.jdbc.drivers[0].default-for-auto=true
