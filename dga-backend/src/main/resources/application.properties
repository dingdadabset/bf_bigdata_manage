# Default Profile Configuration
# Activate specific profile: dev, test, or prod
spring.profiles.active=test

# Common Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
dga.metadata.collect.cron=0 0 2 * * ?
dga.metadata.partition.latest-limit=200
dga.jwt.secret=${DGA_JWT_SECRET:dga-development-secret-change-me}
dga.jwt.expiration-seconds=${DGA_JWT_EXPIRATION_SECONDS:28800}
dga.auth.allow-admin-bootstrap=${DGA_ALLOW_ADMIN_BOOTSTRAP:false}
dga.hive.legacy-driver.jar-path=${DGA_HIVE_LEGACY_DRIVER_JAR_PATH:}
dga.hive.legacy-driver.class-name=${DGA_HIVE_LEGACY_DRIVER_CLASS_NAME:org.apache.hive.jdbc.HiveDriver}
dga.ldap.posix.uid-number-start=${DGA_LDAP_POSIX_UID_NUMBER_START:20000}
dga.ldap.posix.default-gid-number=${DGA_LDAP_POSIX_DEFAULT_GID_NUMBER:20000}
dga.ldap.posix.home-directory-base=${DGA_LDAP_POSIX_HOME_DIRECTORY_BASE:/home}
dga.ldap.posix.login-shell=${DGA_LDAP_POSIX_LOGIN_SHELL:/bin/bash}
dga.ldap.posix.shadow-account-enabled=${DGA_LDAP_POSIX_SHADOW_ACCOUNT_ENABLED:true}

# SMTP Mail Notification
spring.mail.host=mail.baofu.com
spring.mail.port=465
spring.mail.username=quan_ding@baofu.com
spring.mail.password=${DGA_SMTP_PASSWORD:pD@EwHz1CN3n2q$T}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
dga.notification.mail.enabled=${DGA_NOTIFICATION_MAIL_ENABLED:true}
dga.notification.mail.from=${DGA_NOTIFICATION_MAIL_FROM:quan_ding@baofu.com}
dga.offboarding.revocation.scan.fixed-delay-ms=${DGA_OFFBOARDING_REVOCATION_SCAN_FIXED_DELAY_MS:60000}
dga.offboarding.revocation.scan.initial-delay-ms=${DGA_OFFBOARDING_REVOCATION_SCAN_INITIAL_DELAY_MS:30000}

